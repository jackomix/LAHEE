name: Build ARM64

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Publish linux-arm64
      run: |
        dotnet publish LAHEE.csproj -c Release -r linux-arm64 --self-contained true -o ./publish_output
        
    - name: Copy Web Files & PortMaster Scripts
      run: |
        cp -r Web ./publish_output/Web/
        cp -r Data ./publish_output/Data/
        cp LAHEE.sh ./publish_output/
        cp lahee.gptk ./publish_output/
        cp lahee_start.sh ./publish_output/
        cp lahee_patch_ra.py ./publish_output/
        cp lahee_unpatch_ra.py ./publish_output/
        cp lahee_ui.py ./publish_output/
        cp lahee_ui.sh ./publish_output/
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LAHEE-linux-arm64
        path: ./publish_output
        if-no-files-found: error
